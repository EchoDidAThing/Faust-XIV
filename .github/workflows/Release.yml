name: Create Release

on:
  push:
    branches:
      - 'Public'
    paths:
      - 'Faust.csproj'

jobs:
  build:
    runs-on: windows-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
              10.x.x
      - name: Restore dependencies
        run: dotnet restore Faust.csproj
      - name: Get version
        id: package_version
        uses: KageKirin/get-csproj-version@v1.0.0
        with:
          file: Faust.csproj
          regex: '^(?<major>[0-9]+)\.(?<minor>[0-9]+)\.(?<patch>[0-9]+)\.(?<revision>[0-9]+)$'
      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"
      - name: Build
        run: |
          $ver = '${{ steps.package_version.outputs.version }}'
          invoke-expression 'dotnet build Faust.csproj --no-restore --configuration Beta --nologo -p:Version=$ver -p:FileVersion=$ver -p:AssemblyVersion=$ver'
      - name: write version into jsons
        run: |
          $ver = '${{ steps.package_version.outputs.version }}'
          $path = './Faust/bin/Beta/Faust-Beta.json'
          $json = Get-Content -Raw $path | ConvertFrom-Json
          $json.AssemblyVersion = $ver
          $content = $json | ConvertTo-Json5
          set-content -Path $path -Value $content
      - name: Archive
        run: Compress-Archive -Path Faust/bin/Beta/* -DestinationPath Faust-Beta.zip
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          path: |
            ./Faust-XIV/bin/Beta/*
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Faust Beta ${{ github.ref }}
          draft: false
          prerelease: false
      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          asset_path: ./Faust-Beta.zip
          asset_name: Faust-Beta.zip
          asset_content_type: application/zip

      - name: Write out repo.json
        run: |
          $ver = '${{ steps.package_version.outputs.version }}'
          $path = './repo.json'
          $json = Get-Content -Raw $path | ConvertFrom-Json
          $json[0].AssemblyVersion = $ver
          $json[0].TestingAssemblyVersion = $ver
          $json[0].DownloadLinkInstall = $json.DownloadLinkInstall -replace '[^/]+/Faust-Beta.zip',"$ver/Faust-Beta.zip"
          $json[0].DownloadLinkTesting = $json.DownloadLinkTesting -replace '[^/]+/Faust-Beta.zip',"$ver/Faust-Beta.zip"
          $json[0].DownloadLinkUpdate = $json.DownloadLinkUpdate -replace '[^/]+/Faust-Beta.zip',"$ver/Faust-Beta.zip"
          $content = $json | ConvertTo-Json -AsArray
          set-content -Path $path -Value $content

      - name: Commit repo.json
        run: |
          git config --global user.name "Actions User"
          git config --global user.email "actions@github.com"
          git fetch origin Public
          git branch -f Public ${{ github.sha }}
          git checkout Public
          git add repo.json
          git tag -m "CI: create new tag" v${{ steps.package_version.outputs.version }}
          git commit -m "[CI] Updating repo.json for ${{ github.ref_name }}" || true
          git push origin Public
